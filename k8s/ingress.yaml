apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptimeops
  namespace: uptimeops
spec:
  ingressClassName: traefik
  rules:
    - host: uptimeops.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptimeops-frontend
                port:
                  number: 80

    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptimeops-frontend
                port:
                  number: 80
